[versions]
# 8.5.2 -> 8.6.0. The androidx stack this project already resolves to
# (navigation-compose 2.9.7, compose-ui 1.11.2, core-ktx 1.16.0,
# material3 1.4.0, lifecycle 2.11.0-beta01 and 11 more) publishes AAR
# metadata REQUIRING AGP 8.6.0+, so every Android build failed
# checkDebugAarMetadata until this moved. 8.6.0 specifically: it is the
# lowest version satisfying that floor, and it still requires only Gradle
# 8.7 -- exactly what the wrapper already pins -- so this does NOT drag the
# Gradle distribution along with it. 8.6 also officially supports
# compileSdk 35, which is the other half of the same failure.
agp = "8.6.0"
# Bumped from 2.0.21 -- confirmed directly that Xcode 26 (this project's
# actual dev machine) cannot be built against at all with 2.0.21's bundled
# Kotlin/Native LLVM: cinterop fails parsing the iOS 26.5 SDK's own system
# headers ("module '_c_standard_library_obsolete' requires feature
# 'found_incompatible_headers__check_search_paths'", cascading into
# "unknown type name 'size_t'" etc.) -- a well-documented Kotlin/Xcode-26
# compatibility gap, not a bug in this project. JetBrains added real Xcode
# 26 support starting at Kotlin 2.2.21; 2.4.10 is current stable as of this
# bump. compose-multiplatform bumped alongside it to the version JetBrains'
# own docs pair with 2.4.10 -- Kotlin and Compose Multiplatform versions
# must move together, not independently.
kotlin = "2.4.10"
compose-multiplatform = "1.11.1"
compose-material3 = "1.3.1"
# Must stay a version coil-network-ktor3 (below) was built against -- see
# that entry's comment. Was 2.3.12 originally; bumped to 3.0.0 to match.
ktor = "3.0.0"
kotlinx-serialization = "1.7.3"
kotlinx-coroutines = "1.9.0"
# Bumped from 0.6.1 -- confirmed directly via `./gradlew dependencyInsight`
# that Compose Multiplatform's own material3-uikitsimarm64:1.9.0 artifact
# transitively depends on kotlinx-datetime 0.7.1, and Gradle's standard
# highest-version-wins conflict resolution silently promoted every actual
# compile to 0.7.1 regardless of this pin -- so 0.6.1 was never really the
# version in use. Pinning to what's actually resolved avoids that mismatch
# resurfacing confusingly later. Note kotlinx-datetime 0.7.x deprecated
# kotlinx.datetime.Clock in favor of the stdlib's own kotlin.time.Clock --
# see ApiCache.kt's import comment for the call-site-level fix this required.
kotlinx-datetime-version = "0.7.1"
# Bumped from 2.8.0-alpha10 -- confirmed directly via lldb (breakpoint on
# ThrowException) that this old alpha's NavBackStackEntry.updateState()
# throws kotlin.internal.IrLinkageError at runtime on iOS, an ABI break
# between navigation-compose's compiled klib and the actual
# lifecycle/compose-runtime declarations linked into the app -- this was the
# real cause of the "crash on launch" that the crash reporter could only
# ever show as an opaque SurfaceMetalRedrawer.draw abort (the throw happens
# during the first real composition/navigation pass, which is reached from
# a draw callback). 2.9.2 is the version JetBrains' own compose-multiplatform
# docs pair with Compose Multiplatform 1.11.1 (this catalog's
# compose-multiplatform version above) -- see kotlinlang.org "What's new in
# Compose Multiplatform 1.11.1" Dependencies table.
navigation-compose-version = "2.9.2"
# Bumped from 2.8.4 for the same reason -- 2.11.0-beta01 is what JetBrains
# pairs with Compose Multiplatform 1.11.1 and navigation-compose 2.9.2 in
# that same Dependencies table. Keeping lifecycle and navigation-compose on
# mismatched eras is exactly what produced the IrLinkageError above.
lifecycle = "2.11.0-beta01"
koin = "4.0.4"
multiplatform-settings-version = "1.2.0"
# coil-network-ktor3's own POM declares a hard runtime dependency on a
# specific io.ktor:ktor-client-core version (check its published .pom if
# bumping coil). When that pinned version differs from this catalog's `ktor`
# version, Gradle's default "highest version wins" conflict resolution
# silently promotes ktor-client-core to whichever is higher across the whole
# graph, while ktor-client-android/darwin (the engine artifacts, requested
# only at the `ktor` version above) stay on the older one. The two ends up
# binary-mismatched at runtime: AndroidClientEngine's <init> references
# io.ktor.client.plugins.HttpTimeout and crashes with NoClassDefFoundError
# because the class that actually made it into the merged classpath doesn't
# line up. Fixed by aligning coil (3.0.0-rc01, which pinned ktor 3.0.0-rc-2)
# to the stable coil 3.0.0 release, which pins exactly ktor-client-core
# 3.0.0 -- matching this catalog's `ktor` version above. Keep these two in
# lockstep on any future bump.
coil = "3.0.0"
sqldelight = "2.0.2"
# Bumped 34 -> 35: androidx.navigation resolves transitively to
# navigation-compose-android 2.9.7, whose AAR metadata REQUIRES consumers to
# compile against API 35 or later, so every Android build (app and unit
# tests alike) failed checkDebugAarMetadata with 32 such issues until this
# moved. compileSdk only controls which APIs are available at compile time,
# so raising it is safe on its own; android-targetSdk deliberately stays at
# 34 because THAT is the one that opts the app into new runtime behaviour
# and is a separate decision to make deliberately, not a side effect of
# unblocking the build.
android-compileSdk = "35"
android-minSdk = "26"
android-targetSdk = "34"
firebase-bom-version = "33.4.0"
# NotificationCompat.CallStyle/MessagingStyle + RemoteInput for the incoming-
# call ringtone/quick-actions and message quick-reply notifications -- not
# previously a direct dependency (LocalNotificationBridge.kt used the raw
# platform android.app.Notification.Builder, which has neither).
androidx-core-version = "1.13.1"
# GetStream's Maven Central republish of Google's official prebuilt WebRTC
# AAR (Google stopped publishing org.webrtc:google-webrtc there directly) --
# same `org.webrtc.*` package/API as upstream, just a different groupId.
# See messaging/call/WebRtcEngine.android.kt. Version key deliberately NOT
# named identically to the library key below -- see firebase-bom-version's
# own comment further up in this file for why that collision breaks the
# generated Gradle accessor.
stream-webrtc-android-version = "1.3.10"
# Real Signal Protocol crypto (X3DH + Double Ratchet), built from the
# public-domain Signal specifications rather than depending on Signal's own
# AGPLv3 `libsignal` -- see messaging/crypto/signal/ for the from-spec
# implementation. BouncyCastle supplies only the low-level primitives
# (X25519 ECDH, AES-256-CBC, HMAC-SHA256), permissively (MIT-style)
# licensed. Version confirmed current on Maven Central (repo1.maven.org
# metadata, last updated 2026-08-07) at implementation time.
bouncycastle-version = "1.85.2"
# The Gradle plugin that reads google-services.json and generates the
# resources/config firebase-messaging (above) actually needs at runtime to
# initialize -- see composeApp/build.gradle.kts's conditional `apply` (only
# applied when that file is actually present, so a checkout without your own
# Firebase project's json still builds cleanly) and README.md's push section.
google-services-version = "4.4.2"
# Crashlytics Gradle plugin -- reads the same google-services.json (applied
# conditionally alongside it, see composeApp/build.gradle.kts) to wire crash/
# non-fatal/ANR reporting up to the same Firebase project push already uses.
# Confirmed current on Firebase's own docs (firebase.google.com/docs/crashlytics/android/get-started) at implementation time.
firebase-crashlytics-version = "3.0.7"
# "provide a image & video viewer - shouldnt be going outside the app" --
# AndroidX Media3's ExoPlayer + PlayerView, the standard in-app video
# playback stack (successor to the old ExoPlayer2/exoplayer2-ui artifacts).
# Android-only, same expect/actual pattern as stream-webrtc-android/coil-gif
# above -- see messaging/ui/VideoPlayerView.android.kt.
media3-version = "1.4.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime-version" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
# Android's Ktor engine (above) wraps HttpURLConnection, which has no
# WebSocket support at all -- every wsClient.connect() attempt was failing
# instantly with "Engine doesn't support WebSocketCapability" (confirmed via
# the console logging added in 7d53d9a), which is the actual root cause of
# every "messages/calls not sent" report this session: the socket never
# connected once, on any build. OkHttp's Ktor engine does support
# WebSockets and is the engine Ktor's own docs recommend for Android.
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-version" }

navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose-version" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform-settings-version" }
multiplatform-settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatform-settings-version" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
# Android-only artifact (ImageDecoder/Movie are Android platform APIs, no
# iOS/Native variant is published) -- see messaging/ui/GifImageLoader.kt.
# Without this, Coil has no animated-GIF decoder at all and a GIF message
# renders as a static single frame regardless of any repeatCount/tap-replay
# logic layered on top, which was the actual root cause behind "GIF sent/
# received should be autoplaying" -- there was no animation happening yet
# to control the loop count of.
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.2" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom-version" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
stream-webrtc-android = { module = "io.getstream:stream-webrtc-android", version.ref = "stream-webrtc-android-version" }
bouncycastle-provider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle-version" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3-version" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3-version" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
turbine = { module = "app.cash.turbine:turbine", version = "1.1.0" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Auto-generates Kotlin/Native bindings for the GoogleWebRTC pod (see
# composeApp/build.gradle.kts's cocoapods {} block) -- WebRtcEngine.ios.kt's
# `platform.WebRTC.*` imports don't exist without this. Only takes effect
# once iosApp/ is turned into a real Xcode project with `pod install` run
# against iosApp/Podfile (see that file + iosApp/README.md) -- a plain
# `./gradlew build` with no Xcode project present still works for every
# other target, this plugin only wires up the iOS side's pod integration.
# kotlinCocoapods intentionally NOT declared here -- version catalog
# `alias(...)` entries require a non-empty version string (confirmed
# directly: "plugin version '' is invalid: cannot be null or empty"), but
# this plugin ships bundled inside the same kotlin-gradle-plugin artifact
# org.jetbrains.kotlin.multiplatform already puts on the buildscript
# classpath, and requesting an explicit version for it AGAIN triggers a
# different error ("already on the classpath with an unknown version, so
# compatibility cannot be checked" -- also confirmed directly). The only
# combination that works is applying it via plain `id(...)` with no version
# at all, which the `alias()` DSL doesn't support -- see
# composeApp/build.gradle.kts's plugins {} block, which applies it directly
# instead of through this catalog.
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
googleServices = { id = "com.google.gms.google-services", version.ref = "google-services-version" }
firebaseCrashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-version" }
