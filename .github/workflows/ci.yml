name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # JDK 21 -- matches what README.md's "Build status" section says this
      # project is actually built/tested with locally, and what
      # composeApp/build.gradle.kts's Kotlin/AGP versions (2.4.10 / 8.6.0,
      # see gradle/libs.versions.toml) expect on the Gradle daemon's JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Handles the Gradle wrapper, dependency and build-cache caching in one
      # step (the officially recommended replacement for hand-rolling an
      # actions/cache block around ~/.gradle) -- no extra config needed since
      # this repo already commits gradle-wrapper.properties pinning 8.7.
      - uses: gradle/actions/setup-gradle@v4

      # Same APK a developer gets from `./gradlew :composeApp:assembleDebug`
      # locally -- debug because this job has no release-signing secrets
      # configured (see composeApp/build.gradle.kts's signingConfigs block
      # and README.md's "Release signing" section), and a debug build is
      # the right thing for CI to prove compiles cleanly on every push/PR
      # anyway.
      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      # commonTest (ApiCache/ApiClient/SuggestionsRepository unit tests, plus
      # the Compose UI test in ui/components) running on the Android target --
      # see README.md's "Build status" section for the equivalent iOS
      # simulator task, which runs in the dedicated job below.
      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Upload Android build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-evidence
          path: |
            composeApp/build/outputs/apk/debug/
            composeApp/build/reports/tests/testDebugUnitTest/
            composeApp/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  ios-simulator:
    # macos-15 is the Apple Silicon runner needed by iosSimulatorArm64.
    # Xcode 26.3, its iOS 26.2 runtime, JDK 21 and CocoaPods 1.17.0 are
    # published in the runner image; Kotlin/Native is pinned to 2.4.10.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify iOS toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = "26.3"
          java -version
          test "$(pod --version)" = "1.17.0"
          xcrun simctl list runtimes | grep "iOS 26.2"

      # CocoaPods requires a framework directory before it can resolve the
      # local ComposeApp podspec. This Gradle task creates its dummy framework.
      - name: Prepare ComposeApp pod
        run: ./gradlew :composeApp:generateDummyFramework

      - name: Install locked CocoaPods
        working-directory: iosApp
        run: pod install --deployment

      - name: Run iOS shared and UI tests
        run: ./gradlew :composeApp:iosSimulatorArm64Test

      - name: Build iOS app for simulator
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/ios-app-build.log

      - name: Install and launch app on simulator
        run: |
          set -o pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime, entries in devices.items() if runtime.endswith("iOS-26-2") for device in entries if device["name"] == "iPhone 17 Pro"))')"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" build/ios/Build/Products/Debug-iphonesimulator/iosApp.app
          xcrun simctl launch "$SIMULATOR_UDID" com.d2m.app | tee build/ios-simulator-launch.log

      - name: Upload iOS simulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-reports
          path: |
            composeApp/build/reports/tests/iosSimulatorArm64Test/
            composeApp/build/test-results/iosSimulatorArm64Test/
            build/ios-app-build.log
            build/ios-simulator-launch.log
          if-no-files-found: warn
          retention-days: 14
